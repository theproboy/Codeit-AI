<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Codeit-AI</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, sans-serif; background: #0d1117; color: #e6edf3; }
    header { padding: 16px 24px; border-bottom: 1px solid #30363d; }
    header h1 { margin: 0; font-size: 18px; }
    header p { margin: 4px 0 0; color: #8b949e; font-size: 13px; }
    main { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; padding: 16px 24px; }
    @media (max-width: 800px) { main { grid-template-columns: 1fr; } }
    textarea { width: 100%; height: 340px; background: #161b22; color: #e6edf3;
      border: 1px solid #30363d; border-radius: 8px; padding: 12px; font-family: ui-monospace, monospace; font-size: 13px; resize: vertical; }
    .buttons { margin: 10px 0; display: flex; gap: 8px; }
    button { background: #238636; color: #fff; border: 0; border-radius: 6px; padding: 8px 16px; font-size: 13px; cursor: pointer; }
    button.secondary { background: #21262d; border: 1px solid #30363d; }
    button:disabled { opacity: .5; cursor: default; }
    pre { background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 12px;
      white-space: pre-wrap; word-break: break-word; min-height: 340px; margin: 0; font-size: 13px; }
    .label { color: #8b949e; font-size: 12px; margin: 0 0 6px; text-transform: uppercase; letter-spacing: .5px; }
  </style>
</head>
<body>
  <header>
    <h1>Codeit-AI</h1>
    <p>Run Python in the browser, and ask an AI to explain or debug it.</p>
  </header>
  <main>
    <section>
      <p class="label">Code</p>
      <textarea id="code">print("Hello from Codeit-AI")
for i in range(3):
    print(i * i)</textarea>
      <div class="buttons">
        <button onclick="run()">▶ Run</button>
        <button class="secondary" onclick="explain()">Explain</button>
        <button class="secondary" onclick="debugCode()">Debug</button>
      </div>
    </section>
    <section>
      <p class="label">Output</p>
      <pre id="output">Output will appear here…</pre>
    </section>
  </main>

  <script>
    const API = "http://localhost:5000";
    const $ = (id) => document.getElementById(id);
    const show = (t) => ($("output").textContent = t);
    let lastError = "";

    async function post(path, body) {
      show("…working…");
      try {
        const res = await fetch(API + path, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(body),
        });
        return await res.json();
      } catch (e) {
        show("Could not reach the backend. Is it running on :5000?");
        return null;
      }
    }

    async function run() {
      const data = await post("/run", { code: $("code").value });
      if (!data) return;
      lastError = data.error || "";
      show((data.output || "") + (data.error ? "\n[stderr]\n" + data.error : "") || "(no output)");
    }
    async function explain() {
      const data = await post("/explain", { code: $("code").value });
      if (data) show(data.explanation || data.error);
    }
    async function debugCode() {
      const data = await post("/debug", { code: $("code").value, error: lastError });
      if (data) show(data.fix || data.error);
    }
  </script>
</body>
</html>
